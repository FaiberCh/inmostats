name: Scraper InmoStats

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      max_runtime_seconds:
        description: "Limite de tiempo para esta corrida (segundos)"
        required: false
        default: "1200"

concurrency:
  group: fincaraiz-scraper
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # ref: master para partir siempre del checkpoint mas reciente. Sin esto, una corrida que espera en
      # la cola (concurrency) arranca con el commit que habia al encolarla, repite las paginas de la
      # corrida anterior y choca al guardar el checkpoint.
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 lxml pandas huggingface_hub

      - name: Scrapear un tramo de la corrida nacional
        run: python -m src.scraper.fincaraiz_scraper
        env:
          MAX_RUNTIME_SECONDS: ${{ github.event.inputs.max_runtime_seconds || '1200' }}
          MIN_HOURS_BETWEEN_RUNS: "24"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Las estadisticas las recalcula el workflow diario stats.yml (hacerlo aqui
      # exigiria bajar todos los CSV en cada corrida).

      # Primero Hugging Face y despues el checkpoint: si falla el push del
      # checkpoint, la siguiente corrida repite unas paginas (duplicados que se
      # quitan por listing_id); al reves se perderian datos sin aviso.
      - name: Subir los CSV nuevos a Hugging Face
        run: python scripts/upload_raw_to_hf.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Guardar el checkpoint nuevo en git
        run: |
          git config user.name "inmostats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/.checkpoint_national.json

          if git diff --cached --quiet; then
            echo "Sin cambios que subir."
            exit 0
          fi

          git commit -m "scrape: actualiza checkpoint"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rechazado (intento $attempt/3), sincronizando con origin antes de reintentar..."
            git pull --rebase origin master
          done

          echo "No se pudo subir tras varios intentos."
          exit 1

      # Al terminar el recorrido completo el cron no se detendria solo (pasado el
      # cooldown arrancaria otra corrida): se apaga el propio workflow y se avisa.
      - name: Apagar el scraper si el recorrido esta completo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Solo si el recorrido termino hace poco (esta corrida lo cerro). Una corrida que no hace nada
          # porque el checkpoint viejo sigue en enfriamiento no debe apagar el workflow antes de que arranque
          # la pasada nueva.
          if python -c "import json,sys,datetime as d; c=json.load(open('data/raw/.checkpoint_national.json')); f=c.get('finished_at'); sys.exit(0 if c.get('done') and f and (d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(f)).total_seconds()<43200 else 1)"; then
            gh workflow disable "Scraper InmoStats"
            curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "parse_mode=HTML" \
              --data-urlencode $'text=🏁 <b>InmoStats</b>: recorrido nacional completo. El scraper se apago solo.\nYa puedes pasar el repo a privado cuando los datos esten verificados.'
          else
            echo "Recorrido en curso, el scraper sigue activo."
          fi

      - name: Notificar fallo por Telegram
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            --data-urlencode $'text=🚨 <b>InmoStats</b>: el workflow de GitHub Actions fallo.\nRevisa: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
